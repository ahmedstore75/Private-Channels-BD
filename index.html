<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Neon IPTV</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --plyr-color-main: #ff007f; --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #060608 100%); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-gradient); color: #fff; height: 100vh; overflow: hidden; display: flex; }
        .container { display: flex; width: 100%; height: 100%; }
        
        /* Sidebar Styling */
        .sidebar { width: 380px; background: rgba(20, 20, 30, 0.85); backdrop-filter: blur(20px); display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header { padding: 20px; text-align: center; font-size: 1.5rem; font-weight: 800; background: linear-gradient(to right, #ff007f, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Search & Filter */
        .toolbar { padding: 10px 15px; display: flex; gap: 10px; }
        .search-bar { flex: 1; padding: 10px 15px; border-radius: 25px; border: 1px solid #443355; background: rgba(255,255,255,0.05); color: #fff; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.3); }

        /* Channel List */
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { display: flex; align-items: center; padding: 12px; margin-bottom: 8px; border-radius: 15px; background: rgba(255,255,255,0.03); cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .channel-item:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); border-color: #ff007f; }
        .channel-item.active { background: linear-gradient(90deg, #ff007f, #7928ca); }
        .channel-logo { width: 50px; height: 50px; border-radius: 10px; margin-right: 15px; object-fit: cover; background: #000; }

        /* Player */
        .main-player { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .video-container { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        /* Skeleton Animation */
        .skeleton { animation: pulse 1.5s infinite; background: #222; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 0.3; } 100% { opacity: 0.6; } }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 50%; }
            .main-player { height: 50%; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-player">
            <div class="video-container">
                <video id="iptv-player" playsinline controls></video>
            </div>
        </div>
        <div class="sidebar">
            <div class="sidebar-header">LIVE STREAMING</div>
            <div class="toolbar">
                <input type="text" id="search" class="search-bar" placeholder="🔍 চ্যানেল খুঁজুন...">
            </div>
            <ul id="channelList" class="channel-list"></ul>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/refs/heads/main/mixiptvchannel.m3u';
        const video = document.getElementById('iptv-player');
        const player = new Plyr(video, { autoplay: true });
        let hls = new Hls();
        let allChannels = [];

        // Fetch & Parse
        fetch(M3U_URL).then(res => res.text()).then(data => {
            allChannels = parseM3U(data);
            renderChannels(allChannels);
            
            // Auto Load Last Channel
            const lastUrl = localStorage.getItem('lastUrl');
            if(lastUrl) playStream(lastUrl);
            else if(allChannels.length > 0) playStream(allChannels[0].url);
        });

        function parseM3U(data) {
            const lines = data.split('\n');
            let channels = [];
            for(let i=0; i<lines.length; i++) {
                if(lines[i].startsWith('#EXTINF:')) {
                    channels.push({
                        name: lines[i].split(',')[1],
                        logo: lines[i].match(/tvg-logo="([^"]+)"/)?.[1] || 'https://via.placeholder.com/60',
                        url: lines[i+1]
                    });
                }
            }
            return channels;
        }

        function renderChannels(channels) {
            const list = document.getElementById('channelList');
            list.innerHTML = channels.map(ch => `
                <li class="channel-item" onclick="playStream('${ch.url}')">
                    <img src="${ch.logo}" class="channel-logo">
                    <span>${ch.name}</span>
                </li>
            `).join('');
        }

        // Debounced Search
        document.getElementById('search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(val));
            renderChannels(filtered);
        });

        function playStream(url) {
            localStorage.setItem('lastUrl', url);
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
            } else {
                video.src = url;
            }
            player.play();
        }
    </script>
</body>
</html>
