<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRO IPTV SMOOTH SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#0a0a0a;
color:#fff;
font-family:Arial;
}

/* HEADER */
.header{
padding:12px;
text-align:center;
background:linear-gradient(90deg,#00c6ff,#0072ff);
font-weight:bold;
font-size:18px;
}

/* VIDEO */
video{
width:100%;
height:42vh;
background:black;
}

/* SEARCH */
.topbar{
padding:8px;
background:#111;
}

input{
width:100%;
padding:10px;
border:none;
outline:none;
background:#1c1c1c;
color:#fff;
border-radius:6px;
}

/* GRID 4 COLUMN FIX */
.channels{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:6px;
padding:6px;
height:52vh;
overflow-y:auto;
background:#0f0f0f;
}

/* CARD */
.channel{
background:#1a1a1a;
border-radius:8px;
padding:6px;
cursor:pointer;
text-align:center;
transition:0.2s;
border:1px solid #222;
}

.channel:hover{
transform:scale(1.05);
border-color:#00c6ff;
}

/* LOGO */
.channel img{
width:34px;
height:34px;
object-fit:contain;
background:#000;
border-radius:5px;
}

/* NAME */
.channel span{
font-size:10px;
display:block;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
</style>
</head>

<body>

<div class="header">📺 PRO IPTV FULL SYSTEM</div>

<video id="video" controls autoplay></video>

<div class="topbar">
<input id="search" placeholder="Search channel...">
</div>

<div class="channels" id="channelList">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
let video=document.getElementById("video");
let channelList=document.getElementById("channelList");
let search=document.getElementById("search");

let hls;
let allChannels=[];

/* 🔥 YOUR M3U LINK */
let m3uUrl="https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/refs/heads/main/mixiptvchannel.m3u";

/* LOAD M3U */
async function loadPlaylist(){
try{

channelList.innerHTML="Loading...";

let res=await fetch(m3uUrl,{cache:"no-store"});
let text=await res.text();

let lines=text.split("\n");

let name="";
let logo="";

allChannels=[];

for(let i=0;i<lines.length;i++){

let line=lines[i].trim();

if(line.startsWith("#EXTINF")){

let parts=line.split(",");
name=parts[1]||"Unknown";

let logoMatch=line.match(/tvg-logo="(.*?)"/i);
logo=logoMatch?logoMatch[1]:"";

}
else if(line.startsWith("http")){

allChannels.push({
name:name,
url:line,
logo:logo
});
}
}

render(allChannels);

}catch(e){
channelList.innerHTML="❌ Load failed";
console.log(e);
}
}

/* RENDER */
function render(list){
channelList.innerHTML="";

list.forEach(ch=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<img src="${ch.logo||'https://via.placeholder.com/60'}">
<span>${ch.name}</span>
`;

div.onclick=()=>play(ch.url);

channelList.appendChild(div);
});
}

/* ⚡ SMOOTH PLAY FIX (ANTI FREEZE) */
function play(url){

if(hls){
hls.destroy();
}

hls=new Hls({
enableWorker:true,
lowLatencyMode:true,

startLevel:0,
maxBufferLength:10,
backBufferLength:5,
liveSyncDurationCount:2,

fragLoadingTimeOut:20000,
manifestLoadingTimeOut:20000,
levelLoadingTimeOut:20000
});

hls.loadSource(url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play().catch(()=>{});
});

/* AUTO RECOVER */
hls.on(Hls.Events.ERROR,(event,data)=>{

if(data.fatal){

if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
hls.startLoad();
}

else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
hls.recoverMediaError();
}

else{
hls.destroy();
setTimeout(()=>play(url),1500);
}
}
});

/* BUFFER FIX */
setInterval(()=>{
if(video.readyState<3){
video.play().catch(()=>{});
}
},3000);

}

/* SEARCH */
search.addEventListener("input",()=>{
let v=search.value.toLowerCase();
render(allChannels.filter(c=>c.name.toLowerCase().includes(v)));
});

loadPlaylist();
</script>

</body>
</html>
