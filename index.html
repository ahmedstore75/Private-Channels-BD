<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Neon IPTV</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* কালারফুল ডার্ক গ্রাডিয়েন্ট ব্যাকগ্রাউন্ড */
            background: linear-gradient(135deg, #0f0c20 0%, #060608 100%);
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- SIDEBAR STYLE (DESKTOP) --- */
        .sidebar {
            width: 380px;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(10px); /* গ্লাস ইফেক্ট */
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            box-shadow: 5px 0 25px rgba(0,0,0,0.7);
        }

        .sidebar-header {
            padding: 25px 20px;
            background: linear-gradient(to bottom, rgba(30, 25, 50, 0.5), rgba(20, 20, 30, 0.5));
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            /* আকর্ষণীয় কালারফুল টেক্সট */
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid #443355;
            background-color: rgba(255, 255, 255, 0.07);
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        /* সার্চ বারে ক্লিক করলে নিওন গ্লো করবে */
        .search-bar:focus {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            background-color: rgba(255, 255, 255, 0.12);
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* স্ক্রলবার সুন্দর করার জন্য */
        .channel-list::-webkit-scrollbar {
            width: 6px;
        }
        .channel-list::-webkit-scrollbar-thumb {
            background: #443355;
            border-radius: 10px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* মাউস হোভার ইফেক্ট */
        .channel-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(121, 40, 202, 0.4);
        }

        /* একটিভ চ্যানেলে নিওন ম্যাজেন্টা/পার্পল গ্রাডিয়েন্ট */
        .channel-item.active {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
            border-color: transparent;
        }

        .channel-logo {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 15px;
            background-color: #000;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .channel-name {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- MAIN PLAYER AREA --- */
        .main-player {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        /* ভিডিওর কালো দাগ সম্পূর্ণ দূর করার সিএসএস */
        .video-js video, 
        .vjs-tech {
            object-fit: fill !important; 
            width: 100% !important;
            height: 100% !important;
        }

        /* ফুলস্ক্রিন মোডেও কালো দাগ বিন্দুমাত্র থাকবে না */
        .video-js:fullscreen .vjs-tech,
        .video-js:-webkit-full-screen .vjs-tech,
        .video-js::-webkit-media-controls-panel,
        video:-webkit-full-screen {
            object-fit: fill !important; 
            width: 100vw !important;
            height: 100vh !important;
        }

        /* --- 📱 RESPONSIVE FOR MOBILE (PORTRAIT) 📱 --- */
        @media (max-width: 768px) and (orientation: portrait) {
            body {
                flex-direction: column;
            }

            .container {
                flex-direction: column;
            }

            .main-player {
                width: 100%;
                height: 32vh;
                flex: none;
                border-bottom: 2px solid #ff007f; /* মোবাইলে প্লেয়ারের নিচে একটি কালার বর্ডার */
            }

            .sidebar {
                width: 100%;
                height: 68vh;
                border-right: none;
            }

            .channel-list {
                display: grid;
                grid-template-columns: repeat(2, 1fr); 
                gap: 10px; 
                padding: 12px;
                width: 100%;
            }

            .channel-item {
                margin-bottom: 0;
                padding: 12px 8px;
                flex-direction: column;
                text-align: center;
                justify-content: center;
                height: auto;
            }

            .channel-logo {
                margin-right: 0;
                margin-bottom: 8px;
                width: 50px !important;
                height: 50px !important;
            }

            .channel-name {
                font-size: 0.85rem;
                width: 100%;
                text-align: center;
            }
        }

        /* --- LANDSCAPE MODE --- */
        @media (max-width: 950px) and (orientation: landscape) {
            .sidebar {
                display: none !important; 
            }

            .main-player {
                width: 100vw !important;
                height: 100vh !important;
                position: fixed;
                top: 0;
                left: 0;
                z-index: 9999;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-player">
            <video id="iptv-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto" playsinline>
                <p class="vjs-no-js">To view this video please enable JavaScript.</p>
            </video>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h2>IPTV Premium Live</h2>
                <input type="text" id="search" class="search-bar" placeholder="🔍 সার্চ করুন চ্যানেল...">
            </div>
            <ul id="channelList" class="channel-list">
                <p style="padding: 20px; color: #ff007f; text-align: center; font-weight: 500; animation: pulse 1.5s infinite;">চ্যানেল লোড হচ্ছে...</p>
            </ul>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/refs/heads/main/mixiptvchannel.m3u'; 

        const player = videojs('iptv-player', {
            fluid: false,
            responsive: true,
            controlBar: {
                pictureInPictureToggle: true,
                volumePanel: { inline: false }
            }
        });

        let allChannels = [];

        // Parse M3U
        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameIndex = line.lastIndexOf(',');
                    if (nameIndex !== -1) currentChannel.name = line.substring(nameIndex + 1).trim();
                    
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    currentChannel.logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/60x60?text=TV';
                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            }
            return channels;
        }

        // Render UI
        function renderChannels(channels) {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = '';

            if(channels.length === 0) {
                listContainer.innerHTML = '<p style="grid-column: span 2; padding: 20px; color: #aaa; text-align: center;">কোনো চ্যানেল পাওয়া যায়নি!</p>';
                return;
            }

            channels.forEach((channel) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerHTML = `
                    <img class="channel-logo" src="${channel.logo}" onerror="this.src='https://via.placeholder.com/60x60?text=Live+TV'">
                    <span class="channel-name">${channel.name || 'Live Stream'}</span>
                `;

                li.addEventListener('click', () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    playStream(channel.url);
                });

                listContainer.appendChild(li);
            });
        }

        function playStream(url) {
            let type = 'video/mp4'; 
            if (url.includes('.m3u8')) type = 'application/x-mpegURL';
            else if (url.includes('.mpd')) type = 'application/dash+xml';

            player.src({ src: url, type: type });
            player.play().catch(e => console.log("Interaction required."));
        }

        // ক্রপ/ফুলস্ক্রিন বাটন ক্লিক ইভেন্ট
        player.on('fullscreenchange', () => {
            if (player.isFullscreen()) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(err => console.log("Orientation lock blocked."));
                        }
                    });
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });

        // Fetch Data
        fetch(M3U_URL)
            .then(res => res.text())
            .then(data => {
                allChannels = parseM3U(data);
                renderChannels(allChannels);
                if (allChannels.length > 0) {
                    playStream(allChannels[0].url);
                    setTimeout(() => {
                        const first = document.querySelector('.channel-item');
                        if(first) first.classList.add('active');
                    }, 300);
                }
            })
            .catch(err => {
                document.getElementById('channelList').innerHTML = '<p style="grid-column: span 2; padding: 20px; color: #ff007f; text-align: center;">প্লেলিস্ট লোড ব্যর্থ।</p>';
            });

        // Search Filter
        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allChannels.filter(ch => ch.name && ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        });
    </script>
</body>
</html>
