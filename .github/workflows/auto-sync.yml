name: Auto Sync Data from API

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে রান হবে
    - cron: '0 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch API Data & Update File
        run: node fetch-data.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update playlist from API"
          file_pattern: "playlist.m3u8"
